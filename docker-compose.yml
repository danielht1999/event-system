services:

  gateway:
    image: nginx:alpine
    container_name: event-system-gateway
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - event-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: event-system-cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --url http://gateway:80   # ← Sin token, sin dominio
    networks:
      - event-network
    depends_on:
      - gateway
    
  postgres:
    image: postgres:15-alpine
    container_name: event-system-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - event-network
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: event-system-adminer
    ports:
      - "8080:8080"
    networks:
      - event-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: event-system-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - event-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: event-system-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    volumes:
      - mailpit_data:/data 
    networks:
      - event-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: event-system-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - event-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: event_system_grafana
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - event-network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

networks:
  event-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  mailpit_data: